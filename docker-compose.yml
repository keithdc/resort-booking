services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: resort
      POSTGRES_PASSWORD: resort
      POSTGRES_DB: resort_booking
    ports:
      - "5433:5432"
    volumes:
      - resort_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resort -d resort_booking"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  resort_pg_data:
